input {
  beats {
    port => 5044 
  }
}


filter {
}


output {
  if "nginx" in [tags] {
    elasticsearch {
      index => "nginx-%{+YYYY.MM.dd}"
      hosts=> ["https://es01:9200", "https://es02:9200", "https://es03:9200"]
      user=> "${ELASTIC_USER}"
      password=> "${ELASTIC_PASSWORD}"
      cacert=> "certs/ca/ca.crt"
    }
  } else {
    elasticsearch {
      index => "app-%{+YYYY.MM.dd}"
      hosts=> ["https://es01:9200", "https://es02:9200", "https://es03:9200"]
      user=> "${ELASTIC_USER}"
      password=> "${ELASTIC_PASSWORD}"
      cacert=> "certs/ca/ca.crt"
    }
  }
}